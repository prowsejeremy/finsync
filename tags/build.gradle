plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.jpd.hz.tags'
    compileSdk 34
    // The NDK installed with the SDK. AGP 8.5.2's default NDK isn't installed.
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 26
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // The same ABIs as BASS in app/src/main/jniLibs.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // AndroidX Test runs the TagLib round-trip tests on a phone, where the native library loads.
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
